<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Proyecto Marketing</title>
    <style>
        /* Estilos Generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa; /* Color de fondo suave */
            color: #333;
        }

        header {
            background-color: #2d3436; /* Color provisional */
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }

        .container {
            padding: 1rem;
            max-width: 500px;
            margin: auto;
        }

        /* Tarjeta de Producto */
        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
        }

        .card-img {
            width: 100px;
            height: 100px;
            background-color: #dfe6e9;
            object-fit: cover;
        }

        .card-content {
            padding: 1rem;
        }

        .card-title {
            margin: 0;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #636e72;
            margin: 0.5rem 0;
        }

        .card-price {
            font-weight: bold;
            color: #e67e22; /* Color de énfasis */
        }
    </style>
</head>
<body>

<header>
    <h1>Nuestra Carta</h1>
    <p>Proyecto Universitario</p>
</header>

<div class="container">
    <!-- Producto 1 -->
    <div class="card">
        <div class="card-img" style="display: flex; justify-content: center; align-items: center; font-size: 0.8rem; color: #999;">Imagen</div>
        <div class="card-content">
            <p class="card-title">Producto 1</p>
            <p class="card-desc">Descripción breve de los ingredientes o características.</p>
            <p class="card-price">Q 00.00</p>
        </div>
    </div>

    <!-- Los otros 3 productos se repiten aquí -->
</div>

</body>
</html>
